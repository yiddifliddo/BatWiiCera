<?xml version="1.0"?>
<!--
BatWiiCera Plaza - custom system for Batocera EmulationStation
Version 0.1.8 | Author: yiddifliddo | Licence: MIT

Installed to /userdata/system/configs/emulationstation/es_systems_plaza.cfg
by install-batocera.sh, by the client's own installer, by the Ports script or
by unpacking the theme's full-install zip. Batocera merges this file over its
own es_systems.cfg, adding a "Plaza" system whose single entry is the
launcher script /userdata/roms/plaza/Plaza.sh. That script starts the Plaza
client with the bundled LÖVE runtime (Batocera has no LÖVE of its own). The
command first restores the executable bit on the presence hook, which is
lost when files are copied in over a Windows network share. The theme shows
the system as a channel tile using the logo named "plaza".
-->
<systemList>
  <system>
    <name>plaza</name>
    <fullname>Plaza</fullname>
    <manufacturer>BatWiiCera</manufacturer>
    <release>2026</release>
    <hardware>engine</hardware>
    <path>/userdata/roms/plaza</path>
    <extension>.sh .SH</extension>
    <command>chmod +x /userdata/system/scripts/batwiicera-plaza-presence.sh 2>/dev/null; bash %ROM%</command>
    <platform>pc</platform>
    <theme>plaza</theme>
  </system>
</systemList>
