  <!-- wordmark -->
  <text x="175" y="88" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-weight="bold" font-size="56" fill="url(#sky)">PLAZA</text>
  <text x="177" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6E6E6E">meet other players</text>
</svg>
