<?xml version="1.0"?>
<!--
BatWiiCera Plaza - custom system for Batocera EmulationStation
Version 0.1.1 | Author: Dan Lee | Licence: MIT

Installed to /userdata/system/configs/emulationstation/es_systems_plaza.cfg
by install-batocera.sh. Batocera merges this file over its own es_systems.cfg,
adding a "Plaza" system whose single entry launches the Plaza client with the
LOVE engine. The theme shows it as a channel tile using the logo named
"plaza".
-->
<systemList>
  <system>
    <name>plaza</name>
    <fullname>Plaza</fullname>
    <manufacturer>BatWiiCera</manufacturer>
    <release>2026</release>
    <hardware>engine</hardware>
    <path>/userdata/roms/plaza</path>
    <extension>.love .LOVE</extension>
    <command>python /usr/lib/python3*/site-packages/configgen/emulatorlauncher.py %CONTROLLERSCONFIG% -system love -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname plaza</command>
    <platform>love</platform>
    <theme>plaza</theme>
    <emulators>
      <emulator name="love">
        <cores>
          <core default="true">love</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
